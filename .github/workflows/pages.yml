name: Build and Deploy Static Site to GitHub Pages

# 把题库导出为静态站点并发布到 GitHub Pages。
# 触发时机：
#   1. main 分支上题目/脚本/前端有改动时
#   2. 手动触发（Actions 页面点 "Run workflow"）
on:
  push:
    branches: [main]
    paths:
      # 整个 oj/ 都纳入（含 config.py 的站点名/标语、core/ 数据模型、data/problems/ 题库）
      - "oj/**"
      - "scripts/build_static.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# GitHub Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 提前探测 Pages 是否已启用。若未启用，deploy 步骤会以难懂的
      # "Failed to create deployment" 报错收场；这里提前给出明确指引。
      - name: 预检 — 确认 Pages 已启用
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          case "$code" in
            200)
              echo "✓ GitHub Pages 已启用" ;;
            404)
              echo "::warning title=GitHub Pages 尚未启用::请打开 Settings → Pages，把 Build and deployment 的 Source 设为 'GitHub Actions'，然后重新运行本工作流。否则 deploy 步骤必然失败。" ;;
            *)
              # 401/403 等属于权限或网络问题，不代表 Pages 未启用，不误报
              echo "预检跳过（HTTP $code），无法判定 Pages 状态，交由 deploy 步骤自行报错。" ;;
          esac

      - name: Build static site
        run: python scripts/build_static.py

      - name: Show output summary
        run: |
          echo "生成文件："
          find static -type f | head -20
          echo "..."
          echo "文件总数：$(find static -type f | wc -l)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
