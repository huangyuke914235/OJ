name: Build and Deploy Static Site to GitHub Pages

# 把题库导出为静态站点并发布到 GitHub Pages。
# 触发时机：
#   1. main 分支上题目/脚本/前端有改动时
#   2. 手动触发（Actions 页面点 "Run workflow"）
on:
  push:
    branches: [main]
    paths:
      - "oj/data/problems/**"
      - "oj/core/**"
      - "scripts/build_static.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# GitHub Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build static site
        run: python scripts/build_static.py

      - name: Show output summary
        run: |
          echo "生成文件："
          find static -type f | head -20
          echo "..."
          echo "文件总数：$(find static -type f | wc -l)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
